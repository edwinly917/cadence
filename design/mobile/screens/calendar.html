<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadence · 日历</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-gray-50 text-gray-900">
<div class="flex h-screen flex-col">

  <header class="flex-shrink-0 border-b border-gray-200 bg-white px-4 pb-3 pt-12">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">日历</h1>
        <p class="mt-0.5 text-xs text-gray-500">2026 年 6 月 · 按截止日期</p>
      </div>
      <div class="flex items-center gap-1">
        <button class="flex h-8 w-8 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100">‹</button>
        <button class="flex h-8 w-8 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100">›</button>
      </div>
    </div>
  </header>

  <main class="no-scrollbar flex-1 overflow-y-auto pb-24">
    <!-- Month grid -->
    <div class="bg-white px-3 py-3">
      <div class="grid grid-cols-7 text-center text-[11px] font-medium text-gray-400">
        <div class="py-1">日</div><div class="py-1">一</div><div class="py-1">二</div><div class="py-1">三</div><div class="py-1">四</div><div class="py-1">五</div><div class="py-1">六</div>
      </div>
      <div class="grid grid-cols-7 gap-y-1 text-center text-sm">
        <!-- week 1: Jun 2026 starts Monday Jun 1 -->
        <div class="py-2 text-gray-300">31</div>
        <div class="flex flex-col items-center py-1"><span class="text-gray-900">1</span><span class="mt-0.5 h-1.5 w-1.5 rounded-full bg-yellow-400"></span></div>
        <div class="flex flex-col items-center py-1"><span class="flex h-7 w-7 items-center justify-center rounded-full bg-gray-900 font-medium text-white">2</span></div>
        <div class="flex flex-col items-center py-1"><span class="text-gray-900">3</span><span class="mt-0.5 h-1.5 w-1.5 rounded-full bg-red-400"></span></div>
        <div class="flex flex-col items-center py-1"><span class="text-gray-900">4</span><span class="mt-0.5 h-1.5 w-1.5 rounded-full bg-red-400"></span></div>
        <div class="py-2">5</div>
        <div class="py-2">6</div>
        <!-- week 2 -->
        <div class="py-2">7</div>
        <div class="py-2">8</div>
        <div class="flex flex-col items-center py-1"><span class="text-gray-900">9</span><span class="mt-0.5 h-1.5 w-1.5 rounded-full bg-blue-400"></span></div>
        <div class="flex flex-col items-center py-1"><span class="text-gray-900">10</span><span class="mt-0.5 h-1.5 w-1.5 rounded-full bg-gray-400"></span></div>
        <div class="py-2">11</div>
        <div class="py-2">12</div>
        <div class="py-2">13</div>
        <!-- week 3 -->
        <div class="py-2">14</div>
        <div class="flex flex-col items-center py-1"><span class="text-gray-900">15</span><span class="mt-0.5 h-1.5 w-1.5 rounded-full bg-amber-400"></span></div>
        <div class="py-2">16</div>
        <div class="py-2">17</div>
        <div class="py-2">18</div>
        <div class="py-2">19</div>
        <div class="py-2">20</div>
        <!-- week 4 -->
        <div class="py-2">21</div>
        <div class="py-2">22</div>
        <div class="py-2">23</div>
        <div class="py-2">24</div>
        <div class="py-2">25</div>
        <div class="py-2">26</div>
        <div class="py-2">27</div>
        <!-- week 5 -->
        <div class="py-2">28</div>
        <div class="py-2">29</div>
        <div class="flex flex-col items-center py-1"><span class="text-gray-900">30</span><span class="mt-0.5 h-1.5 w-1.5 rounded-full bg-blue-400"></span></div>
        <div class="py-2 text-gray-300">1</div>
        <div class="py-2 text-gray-300">2</div>
        <div class="py-2 text-gray-300">3</div>
        <div class="py-2 text-gray-300">4</div>
      </div>
    </div>

    <!-- Selected day's DDL tasks -->
    <div class="px-4 pt-4">
      <h2 class="mb-2 text-sm font-medium text-gray-700">6 月 3 日 · 当日截止</h2>
      <div class="space-y-2">
        <a href="task-form.html" class="block rounded-md border border-gray-200 bg-white px-3 py-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-sm">提交 Q3 季度财报终稿</span>
            <span class="rounded bg-blue-50 px-1.5 py-0.5 text-[10px] text-blue-600">工作</span>
          </div>
          <div class="mt-1.5"><span class="rounded bg-orange-100 px-1.5 py-0.5 text-[11px] font-medium text-orange-700">⏰ 截止 2026-06-03</span></div>
        </a>
        <a href="task-form.html" class="block rounded-md border border-gray-200 bg-white px-3 py-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-sm">部门月度评审准备</span>
            <span class="rounded bg-blue-50 px-1.5 py-0.5 text-[10px] text-blue-600">工作</span>
          </div>
          <div class="mt-1.5"><span class="rounded bg-orange-100 px-1.5 py-0.5 text-[11px] font-medium text-orange-700">⏰ 截止 2026-06-03</span></div>
        </a>
      </div>
    </div>
  </main>

  <!-- Bottom Tab Bar (日历 active) -->
  <nav class="flex-shrink-0 border-t border-gray-200 bg-white/95 px-2 pb-6 pt-2 backdrop-blur">
    <div class="flex items-stretch justify-around">
      <a href="board.html" class="flex flex-1 flex-col items-center gap-0.5 py-1 text-gray-400"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-6 w-6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="text-[10px]">看板</span></a>
      <a href="calendar.html" class="flex flex-1 flex-col items-center gap-0.5 py-1 text-gray-900"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-6 w-6"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span class="text-[10px] font-medium">日历</span></a>
      <a href="pending.html" class="relative flex flex-1 flex-col items-center gap-0.5 py-1 text-gray-400"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-6 w-6"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><span class="absolute right-5 top-0 rounded-full bg-amber-500 px-1.5 text-[10px] font-medium text-white">3</span><span class="text-[10px]">待定</span></a>
      <a href="archive.html" class="flex flex-1 flex-col items-center gap-0.5 py-1 text-gray-400"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-6 w-6"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M9 12h6"/></svg><span class="text-[10px]">归档</span></a>
      <a href="timer.html" class="flex flex-1 flex-col items-center gap-0.5 py-1 text-gray-400"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-6 w-6"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg><span class="text-[10px]">计时</span></a>
    </div>
  </nav>

</div>

</html>
