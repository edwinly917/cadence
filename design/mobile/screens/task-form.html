<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadence · 新建任务</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-gray-50 text-gray-900">
<div class="relative flex h-screen flex-col overflow-hidden">

  <!-- Dimmed board behind -->
  <div class="pointer-events-none flex-1 select-none px-4 pt-12 opacity-40 blur-[1px]">
    <h1 class="text-2xl font-semibold tracking-tight">Cadence</h1>
    <p class="mt-0.5 text-xs text-gray-500">个人任务管理 · 工作 × 生活 × 四象限</p>
    <div class="mt-4 space-y-3">
      <div class="flex overflow-hidden rounded-lg border border-gray-200 bg-white">
        <div class="w-1.5 bg-red-400"></div>
        <div class="flex-1 p-3"><span class="rounded bg-red-100 px-2 py-0.5 text-xs font-semibold text-red-700">重要紧急</span></div>
      </div>
      <div class="flex overflow-hidden rounded-lg border border-gray-200 bg-white">
        <div class="w-1.5 bg-blue-400"></div>
        <div class="flex-1 p-3"><span class="rounded bg-blue-100 px-2 py-0.5 text-xs font-semibold text-blue-700">重要不紧急</span></div>
      </div>
    </div>
  </div>

  <!-- Scrim -->
  <a href="board.html" class="absolute inset-0 z-10 bg-black/40" aria-label="关闭"></a>

  <!-- Bottom sheet -->
  <div class="absolute inset-x-0 bottom-0 z-20 flex max-h-[88%] flex-col rounded-t-2xl bg-white shadow-2xl">
    <!-- grabber + header -->
    <div class="flex-shrink-0 px-5 pt-3">
      <div class="mx-auto h-1.5 w-10 rounded-full bg-gray-300"></div>
      <h2 class="mt-3 text-center text-base font-semibold">新建任务</h2>
    </div>

    <div class="no-scrollbar flex-1 space-y-5 overflow-y-auto px-5 py-4">
      <!-- 标题 -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">标题 <span class="text-red-500">*</span></label>
        <input type="text" placeholder="例如:撰写项目周报" value="撰写本周项目周报"
               class="w-full rounded-md border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-gray-900" />
      </div>

      <!-- 描述 -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">描述</label>
        <textarea rows="3" placeholder="补充细节(可选)"
                  class="w-full resize-none rounded-md border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-gray-900"></textarea>
      </div>

      <!-- 维度 -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">维度</label>
        <div class="flex rounded-lg bg-gray-100 p-0.5 text-sm">
          <button class="flex-1 rounded-md bg-white px-3 py-1.5 font-medium shadow-sm">工作</button>
          <button class="flex-1 rounded-md px-3 py-1.5 text-gray-600">生活</button>
        </div>
      </div>

      <!-- 象限 -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">象限</label>
        <div class="grid grid-cols-2 gap-2">
          <button class="rounded-md border border-gray-200 px-3 py-2.5 text-left">
            <div class="text-sm text-gray-700">重要不紧急</div><div class="text-[11px] text-gray-400">持续投入</div>
          </button>
          <button class="rounded-md border-2 border-red-300 bg-red-50 px-3 py-2.5 text-left ring-1 ring-red-200">
            <div class="text-sm font-medium text-red-700">重要紧急</div><div class="text-[11px] text-red-500">立即处理</div>
          </button>
          <button class="rounded-md border border-gray-200 px-3 py-2.5 text-left">
            <div class="text-sm text-gray-700">不重要不紧急</div><div class="text-[11px] text-gray-400">考虑放弃</div>
          </button>
          <button class="rounded-md border border-gray-200 px-3 py-2.5 text-left">
            <div class="text-sm text-gray-700">紧急不重要</div><div class="text-[11px] text-gray-400">授权或快速处理</div>
          </button>
        </div>
      </div>

      <!-- 截止日期 -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">截止日期</label>
        <div class="flex rounded-lg bg-gray-100 p-0.5 text-sm">
          <button class="flex-1 rounded-md px-3 py-1.5 text-gray-600">无</button>
          <button class="flex-1 rounded-md bg-white px-3 py-1.5 font-medium shadow-sm">软期限</button>
          <button class="flex-1 rounded-md px-3 py-1.5 text-gray-600">硬期限</button>
        </div>

        <!-- 软期限 panel (active) -->
        <div class="mt-3 space-y-3">
          <div class="flex flex-wrap gap-2">
            <button class="rounded-full border border-gray-300 bg-white px-3 py-1 text-xs text-gray-600">7 天</button>
            <button class="rounded-full border border-gray-300 bg-white px-3 py-1 text-xs text-gray-600">14 天</button>
            <button class="rounded-full border border-gray-900 bg-gray-900 px-3 py-1 text-xs font-medium text-white">30 天</button>
            <button class="rounded-full border border-gray-300 bg-white px-3 py-1 text-xs text-gray-600">90 天</button>
          </div>
          <div class="flex items-center gap-2">
            <input type="number" value="30" class="w-24 rounded-md border border-gray-300 px-3 py-2 text-sm outline-none focus:border-gray-900" />
            <span class="text-sm text-gray-500">天</span>
          </div>
          <p class="rounded-md bg-amber-50 px-3 py-2 text-[11px] leading-relaxed text-amber-700">
            接近期限尾段会自动升级为紧急(剩余 ≤ 总时长的 10%)
          </p>
        </div>

        <!-- 硬期限 panel (reference, hidden by default) -->
        <div class="mt-3 hidden space-y-3">
          <input type="date" value="2026-06-10" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm outline-none focus:border-gray-900" />
          <p class="rounded-md bg-amber-50 px-3 py-2 text-[11px] leading-relaxed text-amber-700">
            硬期限到期/逾期会高亮提醒,3 天内自动升级为紧急
          </p>
        </div>
      </div>
    </div>

    <!-- Footer (above home-indicator gap) -->
    <div class="flex-shrink-0 flex gap-3 border-t border-gray-100 px-5 pb-8 pt-3">
      <a href="board.html" class="flex-1 rounded border border-gray-300 bg-white py-2.5 text-center text-sm font-medium text-gray-700">取消</a>
      <a href="board.html" class="flex-1 rounded bg-gray-900 py-2.5 text-center text-sm font-medium text-white">创建</a>
    </div>
  </div>

</div>
</body>
</html>
