<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadence · 日历 (iPad)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-gray-50 text-gray-900">
<div class="flex h-screen flex-col">

  <header class="flex-shrink-0 border-b border-gray-200 bg-white px-8 pb-4 pt-8">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">日历</h1>
        <p class="mt-0.5 text-xs text-gray-500">2026 年 6 月 · 按截止日期</p>
      </div>
      <div class="flex items-center gap-1">
        <button class="flex h-9 w-9 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100">‹</button>

    </div>

    <div class="flex flex-1 flex-col rounded-lg border border-gray-200 bg-white p-5">

        <div class="rounded-md border-2 border-gray-900 bg-gray-50 p-2"><div class="font-medium">2</div></div>

        <div class="rounded-md border border-transparent p-2">13</div>

        <div class="rounded-md border border-transparent p-2 text-gray-300">1</div>
        <div class="rounded-md border border-transparent p-2 text-gray-300">2</div>

      <div class="mt-4 space-y-2">
        <a href="task-form.html" class="block rounded-md border border-gray-200 px-3 py-2.5">
